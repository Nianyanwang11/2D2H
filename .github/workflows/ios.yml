# Builds the iPad app on a Mac in GitHub's cloud, on every push to main (or by hand from the Actions tab).
# The result is an unsigned .ipa, attached to the "latest" release. Sign and install it with Sideloadly or
# AltStore using your own Apple ID (see README). No Apple account details are stored in this repository.
name: iPad app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipad-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the page
        run: python3 build.py

      - name: Bundle pdf.js so PDF import works offline
        run: |
          mkdir -p web/vendor
          curl -fsSL -o web/vendor/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fsSL -o web/vendor/pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project LiveMath.xcodeproj -scheme LiveMath -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/LiveMath.app Payload/
          zip -qry LiveMath-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LiveMath-unsigned-ipa
          path: LiveMath-unsigned.ipa

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LiveMath-unsigned.ipa \
            --title "iPad app (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Unsigned: install it with Sideloadly or AltStore and your Apple ID (see the README)." \
            --latest
